# Build Padavan 4.4 Kernel firmware
# Based on tsl0922's Padavan repository 
# Merged with TurBoTse's modifications

name: Custom Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "选择路由器型号"
        required: true
        type: choice
        options:
          - 360-T6M
          - 360-T6M-PB
          - B70
          - BELL-A040WQ
          - C-Life-XG1
          - CR660x
          - DIR-878
          - DIR-882
          - EA7500
          - G-AX1800
          - G-AX1800-B
          - GHL
          - HAR-20S2U1
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Q10Pro
          - JCG-Q10Pro-PB
          - JCG-Q11Pro
          - JCG-Q20
          - JCG-Q20-PB
          - JCG-Y2
          - JDCLOUD-RE-CP-02
          - JDCLOUD-RE-SP-01B
          - K2P
          - K2P-NANO
          - K2P-USB
          - KOMI-A8
          - MI-4
          - MI-R3G
          - MI-R3P-PB
          - MI-R3P-SPI
          - MI-R3P
          - MI-R4A
          - MR2600
          - MSG1500
          - MSG1500-Z
          - NETGEAR-BZV
          - NETGEAR-R6800
          - NETGEAR-R7450
          - NEWIFI
          - NEWIFI3
          - QM-B1
          - R2100
          - RM2100
          - RT-AC85P
          - SIM-AX1800T
          - TX1801
          - WDR8620
          - WRL18M4GD
          - WE410443-TC
          - WIA3300-10
          - WR1200JS
          - XY-C1
          - ZTE-E8820S
          - ZTE-E8820V2
          - ZTT-RX6000
        default: K2P
      toolchain:
        description: "选择编译工具链"
        required: true
        type: choice
        options:
          - mipsel-linux-musl
          - mipsel-linux-uclibc
        default: mipsel-linux-musl
      mt7621_oc:
        description: "CPU频率：0x312=1000MHz、0x362=1100MHz、0x372=1120MHz、0x3B2=1200MHz"
        type: choice
        options:
          - '0x312'
          - '0x362'
          - '0x372'
          - '0x3B2'
        default: '0x312'
      plugin_multi:
        description: '插件多选，英文逗号分隔无空格；可选：shadowsocks,v2ray,xray,trojan,ssobfs,smartdns,vlmcsd,ttyd,iperf3'
        required: true
        type: string
        default: shadowsocks,xray,trojan,ssobfs,smartdns,vlmcsd
      customization:
        description: '自定义配置JSON'
        required: true
        type: string
        default: '{"lanip":"192.168.2.1","signaccount":"admin","signpassword":"admin","wifi2gssid":"Padavan","wifi2gpsk":"1234567890","wifi5gssid":"Padavan-5G","wifi5gpsk":"1234567890"}'
      nanoversion:
        description: "编译Nano精简版本"
        type: boolean
        default: false
      release:
        description: "上传到GitHub Release"
        type: boolean
        default: true

env:
  TOOLCHAIN: ${{ inputs.toolchain }}
  TOOLCHAIN_URL: https://github.com/KuniJiwa/padavan/releases/download/toolchain/${{ inputs.toolchain }}.tar.xz
  CONFIGFILE: trunk/configs/templates/${{ inputs.target }}.config

jobs:
  build:
    name: Build ${{ inputs.target }}-${{ inputs.toolchain }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ inputs.target }}-${{ inputs.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev jq
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      - name: Validate Input JSON
        run: |
          clean(){ echo "$1" | tr -d '\r\n' | sed 's/ //g'; }
          MULTI_RAW=$(clean '${{ inputs.plugin_multi }}')
          CUSTOM_RAW=$(clean '${{ inputs.customization }}')
          ALL_PLUGIN=(shadowsocks v2ray xray trojan ssobfs smartdns vlmcsd ttyd iperf3)
          PLUGIN_JSON=$(jq -n '{}')
          for name in "${ALL_PLUGIN[@]}";do
            PLUGIN_JSON=$(echo "$PLUGIN_JSON" | jq --arg k "$name" '.[$k]="n"')
          done
          if [[ -n "$MULTI_RAW" ]];then
            while read -r item;do
              if [[ -n "$item" && " ${ALL_PLUGIN[@]} " =~ " $item " ]];then
                PLUGIN_JSON=$(echo "$PLUGIN_JSON" | jq --arg k "$item" '.[$k]="y"')
              fi
            done < <(echo "$MULTI_RAW" | tr ',' '\n' | sort -u)
          fi
          echo "PLUGIN_JSON=$(echo "$PLUGIN_JSON" | jq -c .)" >> $GITHUB_ENV
          jq empty <<< "$CUSTOM_RAW" || { echo "❌ 无效的自定义JSON"; exit 1; }

      - name: Export Customization & Plugin Flags
        run: |
          export_json() {
            local JSON=$1
            local PREFIX=$2
            echo "$JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r k v; do
              echo "${PREFIX}${k^^}=$v" >> $GITHUB_ENV
            done
          }
          export_json '${{ inputs.customization }}' ""
          PLUGIN_SRC="$PLUGIN_JSON"
          if [ "${{ inputs.nanoversion }}" = "true" ]; then
            echo "⚠️ Nano版本 — 所有插件已禁用。"
            PLUGIN_SRC=$(echo "$PLUGIN_SRC" | jq 'with_entries(.value="n")')
          fi
          export_json "$PLUGIN_SRC" "PLUGIN_"

      - name: Apply Configurations
        run: |
          chmod +x trunk/custom/scripts/*.sh || true
          bash trunk/custom/scripts/setip.sh "$LANIP" trunk/user/shared/src/defaults.h trunk/user/www/dict/CN.dict
          bash trunk/custom/scripts/setaccount.sh "$SIGNACCOUNT" "$SIGNPASSWORD" trunk/user/shared/src/defaults.h
          bash trunk/custom/scripts/setwifi.sh "$WIFI2GSSID" "$WIFI2GPSK" "$WIFI5GSSID" "$WIFI5GPSK" trunk/user/shared/src/defaults.h
          for key in $(env | grep '^PLUGIN_' | cut -d= -f1); do
            echo "CONFIG_FIRMWARE_INCLUDE_${key#PLUGIN_}=${!key}" >> "$CONFIGFILE"
          done
          echo "CONFIG_FIRMWARE_INCLUDE_OC=y" >> "$CONFIGFILE"
          echo "CONFIG_FIRMWARE_MT7621_OC=${{ inputs.mt7621_oc }}" >> "$CONFIGFILE"

      - name: Apply Nano Optimization
        if: ${{ inputs.nanoversion }}
        run: |
          for fs in ANTFS FAT EXFAT EXT2 EXT3 EXT4 XFS FUSE SWAP; do
            sed -i "s/CONFIG_FIRMWARE_ENABLE_${fs}=y/CONFIG_FIRMWARE_ENABLE_${fs}=n/" "$CONFIGFILE"
          done
          modules=(UVC HID SERIAL AUDIO XFRM QOS IMQ IFB NFSD NFSC CIFS NTFS_3G LPRD U2EC TCPDUMP HDPARM PARTED 
            SMBD WINS SMBD_SYSLOG FTPD RPL2TP EAP_PEAP HTTPS SFTP DROPBEAR DROPBEAR_FAST_CODE OPENSSH OPENVPN SSWAN 
            OPENSSL_EC OPENSSL_EXE XUPNPD MINIDLNA FIREFLY FFMPEG_NEW TRANSMISSION TRANSMISSION_WEB_CONTROL ARIA 
            ARIA_WEB_CONTROL CURL SCUTCLIENT GDUT_DRCOM DOGCOM MINIEAP NJIT_CLIENT SOFTETHERVPN_SERVER SOFTETHERVPN_CLIENT 
            SOFTETHERVPN_CMD VLMCSD TTYD MSD_LITE LRZSZ HTOP NANO IPERF3 DUMP1090 RTL_SDR MTR SOCAT SRELAY MENTOHUST 
            FRPC FRPS REDSOCKS SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS SINGBOX NAIVEPROXY ADBYBY DNSFORWARDER SMARTDNS 
            ADGUARDHOME ZEROTIER ALIDDNS DDNSTO ALDRIVER SQM WIREGUARD )
          for m in "${modules[@]}"; do
            sed -i "s/CONFIG_FIRMWARE_INCLUDE_${m}=y/CONFIG_FIRMWARE_INCLUDE_${m}=n/" "$CONFIGFILE"
          done

      - name: Build Firmware
        run: |
          make ${{ inputs.target }} TOOLCHAIN=${{ inputs.toolchain }}
          mkdir -p trunk/output
          base="${{ inputs.target }}-4.4-${{ inputs.toolchain }}"
          [ "${{ inputs.nanoversion }}" = "true" ] && base="${base}-nano"
          base="${base}-cpufreq-${{ inputs.mt7621_oc }}"
          base="${base}-${BUILD_DATE}"
          i=1
          for f in trunk/images/*.trx; do
            suffix=""
            [ $i -gt 1 ] && suffix="-$i"
            mv "$f" "trunk/output/${base}${suffix}.trx"
            i=$((i+1))
          done

      - uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.target }}-${{ inputs.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/output/*.trx

      - uses: softprops/action-gh-release@master
        if: ${{ inputs.release }}
        with:
          tag_name: ${{ env.BUILD_DATE }}-padavan
          name: Padavan Build ${{ env.BUILD_DATE }}
          overwrite_tags: true
          append_body: false
          body: |
            构建摘要：
            - 日期：${{ env.BUILD_DATE }}
            - 型号：${{ inputs.target }}
            - 工具链：${{ inputs.toolchain }}
            - Nano精简版：${{ inputs.nanoversion }}
            - CPU超频档位：${{ inputs.mt7621_oc }}
            - 插件配置：${{ env.PLUGIN_JSON }}
            - 自定义配置：${{ inputs.customization }}
          files: trunk/output/*.trx