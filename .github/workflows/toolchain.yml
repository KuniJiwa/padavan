# Padavan toolchain build for MIPS routers
# For Padavan 4.4 kernel firmware

name: Build Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [mipsel-linux-musl, mipsel-linux-uclibc]

    steps:
      - uses: actions/checkout@main

      - name: Install Build Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bison flex gperf help2man libtool-bin texinfo

      - name: Build and Package
        run: |
          make CT_TARGET=${{ matrix.target }}
          cd "${{ matrix.target }}"
          tar cJf "../${{ matrix.target }}.tar.xz" .
        working-directory: toolchain

      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}
          path: toolchain/${{ matrix.target }}.tar.xz

      - uses: ncipollo/release-action@main
        with:
          tag: toolchain
          artifacts: toolchain/${{ matrix.target }}.tar.xz
          allowUpdates: true
          prerelease: true
          body: |
            MIPS Padavan 编译工具链

            版本：
            - mipsel-linux-musl（推荐，默认）
            - mipsel-linux-uclibc

            用途：编译 Padavan 4.4 内核固件
            适用：MT7620 / MT7621 / MT7628 / RT3883 等 MIPS 路由器
