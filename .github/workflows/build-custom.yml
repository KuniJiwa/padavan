# Padavan 4.4 custom firmware build
# Single target, plugin selection, optional nano mode, optional CPU overclocking

name: Build Custom

on:
  workflow_dispatch:
    inputs:
      target:
        description: "选择机型"
        required: true
        type: choice
        options:
          - 360-T6M
          - 360-T6M-PB
          - B70
          - BELL-A040WQ
          - C-Life-XG1
          - CR660x
          - DIR-878
          - DIR-882
          - EA7500
          - G-AX1800
          - G-AX1800-B
          - GHL
          - HAR-20S2U1
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Q10Pro
          - JCG-Q10Pro-PB
          - JCG-Q11Pro
          - JCG-Q20
          - JCG-Q20-PB
          - JCG-Y2
          - JDCLOUD-RE-CP-02
          - JDCLOUD-RE-SP-01B
          - K2P
          - K2P-NANO
          - K2P-USB
          - KOMI-A8
          - MI-4
          - MI-R3G
          - MI-R3P-PB
          - MI-R3P-SPI
          - MI-R3P
          - MI-R4A
          - MR2600
          - MSG1500
          - MSG1500-Z
          - NETGEAR-BZV
          - NETGEAR-R6800
          - NETGEAR-R7450
          - NEWIFI
          - NEWIFI3
          - QM-B1
          - R2100
          - RM2100
          - RT-AC85P
          - SIM-AX1800T
          - TX1801
          - WDR8620
          - WRL18M4GD
          - WE410443-TC
          - WIA3300-10
          - WR1200JS
          - XY-C1
          - ZTE-E8820S
          - ZTE-E8820V2
          - ZTT-RX6000
        default: K2P
      toolchain:
        description: "选择工具链"
        required: true
        type: choice
        options:
          - mipsel-linux-musl
          - mipsel-linux-uclibc
        default: mipsel-linux-musl
      plugins:
        description: '插件开关：逗号分隔 前缀 - 表示关闭（留空走模板默认)'
        required: false
        type: string
        default: 'tcpdump,-vlmcsd,-shadowsocks,-xray,-trojan'
      customization:
        description: 'WiFi / IP / 账号 JSON'
        required: true
        type: string
        default: '{"lanip":"192.168.2.1","signaccount":"admin","signpassword":"admin","wifi2gssid":"Padavan","wifi2gpsk":"1234567890","wifi5gssid":"Padavan-5G","wifi5gpsk":"1234567890"}'
      nanoversion:
        description: "Nano 精简版"
        type: boolean
        default: false
      cpufreq:
        description: "开启 CPU 超频"
        type: boolean
        default: false
      mt7621_oc:
        description: "超频频率"
        type: choice
        options: [ '0x312', '0x362', '0x372', '0x3B2' ]
        default: '0x312'
      release:
        description: "上传到 Release"
        type: boolean
        default: true
      oldworkflow:
        description: "删除旧 workflow 运行记录"
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ inputs.target }}-${{ inputs.toolchain }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ inputs.target }}-${{ inputs.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev jq
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      - name: Validate JSON
        run: |
          jq empty <<< '${{ inputs.customization }}' || { echo "❌ customization JSON 格式错误"; exit 1; }

      - name: Export customization env
        run: |
          echo '${{ inputs.customization }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r k v; do
            echo "${k^^}=$v" >> $GITHUB_ENV
          done

      - name: Apply IP / account / WiFi
        run: |
          chmod +x trunk/custom/scripts/*.sh || true
          bash trunk/custom/scripts/setip.sh "$LANIP" trunk/user/shared/src/defaults.h trunk/user/www/dict/CN.dict
          bash trunk/custom/scripts/setaccount.sh "$SIGNACCOUNT" "$SIGNPASSWORD" trunk/user/shared/src/defaults.h
          bash trunk/custom/scripts/setwifi.sh "$WIFI2GSSID" "$WIFI2GPSK" "$WIFI5GSSID" "$WIFI5GPSK" trunk/user/shared/src/defaults.h

      - name: Apply plugin config
        run: |
          python3 trunk/custom/scripts/gen_config.py \
            --config "trunk/configs/templates/${{ inputs.target }}.config" \
            --plugins='${{ inputs.plugins }}' \
            --nano ${{ inputs.nanoversion }} \
            --oc ${{ inputs.cpufreq }} \
            --oc-value='${{ inputs.mt7621_oc }}'

      - name: Build firmware
        run: |
          make ${{ inputs.target }} TOOLCHAIN=${{ inputs.toolchain }}
          mkdir -p trunk/output
          base="${{ inputs.target }}-4.4-${{ inputs.toolchain }}"
          [ "${{ inputs.nanoversion }}" = "true" ] && base="${base}-nano"
          [ "${{ inputs.cpufreq }}" = "true" ] && base="${base}-cpufreq-${{ inputs.mt7621_oc }}"
          base="${base}-${BUILD_DATE}"
          i=1
          for f in trunk/images/*.trx; do
            suffix=""
            [ $i -gt 1 ] && suffix="-$i"
            mv "$f" "trunk/output/${base}${suffix}.trx"
            i=$((i+1))
          done

      - uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.target }}-${{ inputs.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/output/*.trx

      - uses: softprops/action-gh-release@master
        if: ${{ inputs.release }}
        with:
          tag_name: Custom-${{ env.BUILD_DATE }}
          name: Custom ${{ env.BUILD_DATE }}
          body: |
            编译摘要：
            - 日期：${{ env.BUILD_DATE }}
            - 机型：${{ inputs.target }}
            - 工具链：${{ inputs.toolchain }}
            - 插件：${{ inputs.plugins }}
            - CPU 超频：${{ inputs.cpufreq }}（${{ inputs.mt7621_oc }}）
            🌐 LAN 网关 IP：${{ env.LANIP }}
              - 🔑 账号：${{ env.SIGNACCOUNT }} | 密码：${{ env.SIGNPASSWORD }}
              - 📶 2.4G WiFi：${{ env.WIFI2GSSID }} | 密码：${{ env.WIFI2GPSK }}
              - 📶 5G WiFi：${{ env.WIFI5GSSID }} | 密码：${{ env.WIFI5GPSK }}
          files: trunk/output/*.trx

      - uses: Mattraks/delete-workflow-runs@main
        if: ${{ inputs.oldworkflow }}
        with:
          retain_days: 0
          keep_minimum_runs: 5
