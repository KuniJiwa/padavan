# Padavan K2P build for kernel 4.4
# Based on TurBoTse's modifications

name: Build K2P

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target: [K2P, K2P-USB]
        toolchain: [mipsel-linux-musl]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 1
      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}

      - uses: actions/setup-go@main
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)" >> $GITHUB_ENV

      - name: Build Firmware
        run: make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain }}

      - name: Extract Release Body
        run: |
          awk '/固件完整标识：/,/密码：/' trunk/images/image_build.log | grep -v "Build completed at" > release_body.txt

      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}-${{ env.BUILD_DATE }}
          path: trunk/images/*.trx

      - uses: ncipollo/release-action@main
        with:
          commit: ${{ github.sha }}
          tag: ${{ env.BUILD_DATE }}-k2p
          name: K2P Build ${{ env.BUILD_DATE }}
          artifacts: trunk/images/*.trx
          allowUpdates: true
          omitBodyDuringUpdate: false
          bodyFile: release_body.txt
          generateReleaseNotes: false
