### 官方配置文档：https://pymumu.github.io/smartdns/configuration/
### 官方默认示例：https://github.com/pymumu/smartdns/blob/master/etc/smartdns/smartdns.conf
### 注意：本文件优先级高于面板配置，面板设置会被覆盖
####################################################
## 基础配置
####################################################

# 缓存条目数（官方默认：自动，按系统内存调整）
cache-size 8192

# 缓存持久化写入周期，秒（官方默认：86400）
cache-checkpoint-time 86400

# 过期缓存保留时间，秒（官方默认：86400）
serve-expired-ttl 86400

# 最大 TTL 上限，秒（官方默认：远程查询结果）
rr-ttl-max 1800

# 返回给客户端的最大 TTL，秒（官方默认：远程查询结果）
rr-ttl-reply-max 120

# 测速模式（官方默认：ping,tcp:80,tcp:443）
speed-check-mode ping,tcp:443
#speed-check-mode ping,tcp-syn:443

# 强制指定 qtype 返回 SOA，用于屏蔽查询类型（官方默认：无）
force-qtype-SOA 65

# 过滤上游返回的无效 IP 段（官方默认：无）
bogus-nxdomain 127.0.0.0/8
bogus-nxdomain 0.0.0.0/8

# 日志级别（官方默认：error）
log-level info

# 单个日志文件大小（官方默认：128K）
#log-size 128k

# 日志归档数量（官方默认：OpenWrt 2，其他系统 8）
log-num 3

# 读取 dnsmasq 租约文件，解析局域网主机名（官方默认：无）
dnsmasq-lease-file /tmp/dnsmasq.leases

####################################################
## 上游 DNS 服务器
## 参考：https://dns.iui.im/
####################################################

# 全局默认上游（处理未命中分流规则的普通域名）
server 223.5.5.5

## Safe 分组：国内加密 DNS
# 阿里公共 DNS DoT（已注释，备用）
#server-tls 223.5.5.5:853 -blacklist-ip -spki-pin pa14rFR/bBJ25OSjCswaXu6YKWgQ2BDY5jhRRicqeik= -host-name public1.alidns.com -group Safe
# OneDNS 纯净 DoT
server-tls dot-pure.onedns.net:853 -blacklist-ip -spki-pin iga7XjWw3PbkshhBqHCsXnZxcc8ZiU919nTlPx4zhm8= -host-name dot-pure.onedns.net -group Safe
# 腾讯公共 DNS DoT（兼 Safe 与 oversea 分组，作为 oversea 兜底）
server-tls dot.pub:853 -blacklist-ip -spki-pin 5TIMjgyMhA0qmPdK+AM9LX6vNI/9EPBydh/ZXdfcYmI= -host-name dot.pub -group Safe -group oversea

## oversea 分组：海外解析（仅用于 GitHub 相关域名）
# Cloudflare DoT
server-tls 1.1.1.1:853 -host-name cloudflare-dns.com -group oversea -exclude-default-group
# Google DoT
server-tls 8.8.8.8:853 -host-name dns.google -group oversea -exclude-default-group

####################################################
## 域名分流规则
####################################################

domain-rules /github.com/ -c none -n oversea
domain-rules /githubapp.com/ -c none -n oversea
domain-rules /github.io/ -c none -n oversea
domain-rules /githubusercontent.com/ -c none -n oversea
domain-rules /gist.github.com/ -c none -n oversea
domain-rules /githubcopilot.com/ -c none -n oversea
domain-rules /api.github.com/ -c none -n oversea
domain-rules /codeload.github.com/ -c none -n oversea
domain-rules /raw.githubusercontent.com/ -c none -n oversea
domain-rules /uploads.github.com/ -c none -n oversea
domain-rules /githubassets.com/ -c none -n oversea
domain-rules /github.githubassets.com/ -c none -n oversea
domain-rules /github-cloud.s3.amazonaws.com/ -c none -n oversea
domain-rules /ghcr.io/ -c none -n oversea
